# Example profile: the ordinary case — a cluster you reach directly, with an SSH key and
# no second factor. Start here; the other example adds a VPN and TOTP on top.
#
# Copy to ~/.config/hpc-session/<name>.conf, replace every PLACEHOLDER, then:
#   hpc-session -p <name> doctor
#
# Contains no credentials, and should never contain any.

# Requires a matching block in ~/.ssh/config, which is where your key, user and any jump
# host belong — every other tool can see them there too:
#   Host mycluster
#       HostName login.cluster.example.edu
#       User YOUR_CLUSTER_LOGIN
HS_HOST="mycluster"

# Job scripts are copied here and submitted from here. Escape $USER so the REMOTE shell
# expands it — since OpenSSH 9.0 scp speaks SFTP and runs no remote shell, so an
# unexpanded one would reach the copy verbatim. Prefer scratch over your home directory.
HS_REMOTE_WORKDIR="/scratch/\$USER/jobs"

# Defaults for `hpc-session render`. Leave a value empty and its #SBATCH line is dropped,
# so an unset account does not become an `--account=` that SLURM rejects.
HS_SLURM_ACCOUNT=""
HS_SLURM_PARTITION="YOUR_PARTITION"
HS_SLURM_TIME="02:00:00"
HS_SLURM_CPUS="4"
HS_SLURM_MEM="16G"

# No VPN and no second factor: leave every hook empty and the tool behaves as if neither
# existed. `open` is then a plain key login, and `doctor` needs no python3.
HS_VPN_UP_CMD=""
HS_VPN_STATUS_CMD=""
HS_TOTP_BACKEND="none"

# Nothing here monopolises your link, so a long-lived master is pure win: one login covers
# a working day. Shorten it if your site drops idle connections.
HS_CONTROL_PERSIST="8h"
