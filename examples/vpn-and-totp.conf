# Example profile: a cluster behind a full-tunnel VPN that also enforces per-connection
# TOTP. This is the hardest common case; a site with neither needs almost none of it.
#
# Copy to ~/.config/hpc-session/<name>.conf, replace every PLACEHOLDER, then:
#   hpc-session -p <name> doctor
#
# Contains no credentials, and should never contain any: the VPN password and the TOTP
# seed belong in a secret store, not in this file.

# Requires a matching block in ~/.ssh/config:
#   Host mycluster
#       HostName login.cluster.example.edu
#       User YOUR_CLUSTER_LOGIN
HS_HOST="mycluster"

# Job scripts are copied here and submitted from here. Escape $USER so the REMOTE shell
# expands it. Prefer the site's scratch or work filesystem over the home directory:
# schedulers and shared homes both dislike thousands of small writes.
HS_REMOTE_WORKDIR="/scratch/\$USER/jobs"

# Defaults for `hpc-session render`. Leave a value empty to drop its #SBATCH line.
HS_SLURM_ACCOUNT="YOUR_ALLOCATION"
HS_SLURM_PARTITION="YOUR_PARTITION"
HS_SLURM_TIME="1-00:00:00"
HS_SLURM_CPUS="16"
HS_SLURM_MEM="64G"

# --- VPN ----------------------------------------------------------------------------
# Cisco Secure Client, driven through its CLI. The password is read from a secret store
# so it never lands in this file. One-time, on macOS:
#   security add-generic-password -s site-vpn -a "YOUR_VPN_LOGIN" -w
# Other clients (WireGuard, OpenVPN, Tailscale) are in docs/vpn-hooks.md.
HS_VPN_USER="YOUR_VPN_LOGIN"
HS_VPN_UP_CMD='printf "connect vpn.example.edu\n%s\n%s\ny\n" "$HS_VPN_USER" "$(security find-generic-password -s site-vpn -a "$HS_VPN_USER" -w)" | /opt/cisco/secureclient/bin/vpn -s >>"$HOME/.vpn-connect.log" 2>&1'
HS_VPN_DOWN_CMD='/opt/cisco/secureclient/bin/vpn disconnect'
HS_VPN_STATUS_CMD='/opt/cisco/secureclient/bin/vpn state 2>/dev/null | grep -qi "state: connected"'

# --- two-factor authentication ------------------------------------------------------
# A 6-digit code on every new SSH connection. Enroll once in a real terminal, then:
#   hpc-session -p <name> store-seed
# READ docs/2fa-enrollment.md FIRST — a seed stored beside your SSH key puts both
# factors on one disk. The `command` backend avoids storing one at all.
HS_TOTP_BACKEND="keychain"
HS_TOTP_SERVICE="cluster-totp"
HS_TOTP_ACCOUNT="YOUR_CLUSTER_LOGIN"

# A full tunnel monopolises the link, so keep windows short and close between bursts.
# See docs/cluster-etiquette.md.
HS_CONTROL_PERSIST="2h"
